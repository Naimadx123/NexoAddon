boss_bar: false                             # Boss bar when looking at furniture
furniture_evolution_status: true            # Display hologram on interacting with Furniture with evolution mechanics
prevent_furniture_break_with_tools: true
prevent_furniture_break_with_sword: true
double_hit_destroy_mechanic: true           # Destroy furniture with double hit
count_shears_as_silktouch: [ ]              # List of STRINGBLOCKs and CHORUSBLOCKs ids
aura_mechanic_delay: 5                      # Delay of refreshing particles in ticks

default_totem_sound: minecraft:entity.totem.use # Default sound for totem (useful if you wanna use /nexoaddon totem command)
enable_totem_delay: false                   # Adds a 2 tick delay before the totem animation packet (fixes animation on some clients/versions)

update_checker: true

spread:
  max_per_tick: 40                          # Max spread attempts processed server-wide per tick. Lower = lighter on TPS, slower spreading.

liquid:
  refresh_chunks: true                      # Resend affected chunks so clients re-render a liquid's tint without relogging
  refresh_cooldown_ticks: 20                # Per-chunk debounce for that resend (a resend is a FULL chunk packet per viewer).
                                            # Flowing water paints new cells as it spreads, so a short
                                            # value here means a chunk resend several times per second.
  restore_interval_ticks: 20                # How often cells painted by a liquid are checked for water; a cell
                                            # with no water left (bucket, block placed over it, /setblock, drained
                                            # flow...) gets its original biome back. Raise if you have huge lakes.
  max_place_radius: 4                       # Hard cap on Mechanics.liquid.place.radius.
                                            # Biomes are stored per 4x4x4 cell, so any radius above 0
                                            # paints neighbouring cells too and will recolour a liquid
                                            # placed next to this one. Leave place.radius at 0.

custom_biomes:
  enabled: true                             # Generate + register biomes from custom_biomes/*.yml. Read at STARTUP.
                                            # Emergency off-switch needing no file edit: -Dnexoaddon.biomes=off
  namespace: nexoaddon                      # Default namespace for ids written without one
  default_inherit: minecraft:the_void        # Base biome copied from the server jar (neutral: no mobs/features/music)
  prune_orphans: false                      # true = delete generated biomes with no YAML source.
                                            # DANGEROUS: chunks already painted with them will fail to load.

messages:
  bigmining:
    enabled: <green>Bigmining on
    disabled: <red>Bigmining off
  veinminer:
    enabled: <green>VeinMiner on
    disabled: <red>VeinMiner off
  bottledexp:
    not_enough_exp: <red>Not enough experience to convert
  autocatch:
    enabled: "<gray>AutoCatch is now <green>enabled<gray>."
    disabled: "<gray>AutoCatch is now <red>disabled<gray>."
  thor:
    cooldown: "<red>You must wait <time>s before calling the storm again."

debug: false